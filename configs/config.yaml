train:
  # Root of the CHB-MIT dataset (contains chb01/, chb02/, ... subfolders).
  # First run `python -m src.chbmit_prepare --data_dir <this path>` once to
  # generate .tse annotations, then point this at that same path (the script
  # writes .tse files in place; it never moves/copies the .edf files).
  data_dir: data/chb-mit-scalp-eeg-database-1.0.0
  # Feature cache directory (auto-generated .npz files, sped up on reuse)
  cache_dir: data_cache
  # Feature sliding-window length (seconds)
  window_sec: 2.0
  # Feature sliding-window hop (seconds)
  hop_sec: 0.25
  # CHB-MIT's native sampling rate is already 256Hz, so keep it as-is (no resampling)
  resample_hz: 256.0
  # Preprocessing bandpass range (Hz); 0.5-45Hz is a common EEG choice
  bandpass: [0.5, 45.0]
  # Mains notch filter: CHB-MIT was recorded at Boston Children's Hospital (US),
  # where mains frequency is 60Hz (TUSZ's default of 50Hz does not apply here)
  notch_hz: 60.0
  # Background class label name; must match the "bckg" label produced by
  # chbmit_prepare.py in the generated .tse files
  bg_label: bckg

  # memory optimization: very small batch_size to avoid OOM (a single CHB-MIT
  # recording can run up to an hour, producing a lot of frames)
  batch_size: 1
  # number of training epochs
  epochs: 20
  # validation ratio (split by patient; not used by the LOSOCV pipeline)
  val_ratio: 0.2
  # random seed
  seed: 42
  # output directory (logs / weights / TensorBoard)
  out_dir: outputs

  # memory optimization: fewer workers to reduce memory usage
  num_workers: 0
  precompute_cache: none
  progress: bar
  log_interval: 0
  cache_progress: true
  eval_at_start: false

  scheduler: onecycle
  max_lr: 0.0003
  # CHB-MIT only needs binary classification (seiz vs bckg) and has no Excel
  # label sheets, so let the training script auto-scan the .tse files for the
  # "seiz" label and build the class set from that plus bg_label.
  # NOTE: do not add a `labels:` block to this file (not even just json_out),
  # or it will bypass this auto-derivation logic and instead require you to
  # provide Excel sheets / labels.json explicitly.
  auto_labels_from_tse: true
  gradient_accumulation_steps: 8
  clip_grad: 1.0

  # model architecture parameters (kept at the same memory-optimized settings;
  # CHB-MIT channel counts vary by patient/montage, but the feature layer
  # already aggregates every frame's features down to a fixed 14-dim vector,
  # so differing channel counts don't affect the model's input dimension)
  hidden_dim: 128
  num_layers: 2
  attention_heads: 4
  use_attention: true
  dropout: 0.15
  mixup_alpha: 0.0
  spec_time_mask_ratio: 0.0
  spec_time_masks: 0
  spec_feat_mask_ratio: 0.0
  spec_feat_masks: 0
  aug_noise_std: 0.0
  # frame labeling: overlap-ratio threshold between a window and a seizure segment
  label_overlap_ratio: 0.2
  # ignore seizure segments shorter than this duration (seconds); CHB-MIT
  # annotations are usually clean already, so this can stay at 0
  min_seg_duration: 0.0

postprocess:
  prob: 0.8
  smooth: 0.25
  confirm: 2
  cooldown: 0.5
  min_duration: 0.0

# Note: this file deliberately has no `labels:` block -- see the
# auto_labels_from_tse note above. If you later want multi-class typing
# (rather than just binary seiz/bckg), refer to the `labels:` block in the
# original configs/config.yaml and supply your own Excel sheets or hand-write
# outputs_chbmit/labels.json.
